plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

def target = providers.gradleProperty('minecraft_target').getOrElse('26.1.2')
if (!(target in ['1.21.1', '26.1.2'])) {
    throw new GradleException("Unsupported Minecraft target: ${target}. Use 1.21.1 or 26.1.2.")
}
def targetProperties = new Properties()
file("gradle/targets/${target}.properties").withInputStream { targetProperties.load(it) }
targetProperties.each { key, value ->
    ext.set(key.toString(), providers.gradleProperty(key.toString()).getOrElse(value.toString()))
}
def targetJavaVersion = java_version.toInteger()
layout.buildDirectory = layout.projectDirectory.dir("build/${target}")

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Leclown'
        url = 'https://maven.leclowndu93150.dev/releases'
        content { includeGroup 'com.leclowndu93150' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = layout.projectDirectory.dir("run/${target}")
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation files(thaumaturge_jar)
    localRuntime files(curios_jar)
    localRuntime files(lithostitched_jar)
}

if (target == '1.21.1') {
    // Keep data, navigation, scan validation and packet codecs shared between targets.
    // The overrides contain only the APIs that differ substantially in 1.21.1.
    def legacyReplacements = [
        'Identifier': 'ResourceLocation',
        '.identifier()': '.location()',
        'org.jspecify.annotations.Nullable': 'org.jetbrains.annotations.Nullable',
        'net.neoforged.neoforge.client.network.ClientPacketDistributor': 'net.neoforged.neoforge.network.PacketDistributor',
        'ClientPacketDistributor': 'PacketDistributor',
        'node.kind()': 'node.getNodeType()',
        'node.trait()': 'node.getNodeModifier()'
    ]
    def overrides = fileTree('src/minecraft1211/java').files.collect {
        file('src/minecraft1211/java').toPath().relativize(it.toPath()).toString().replace('\\', '/')
    }
    def generateLegacySources = tasks.register('generateLegacySources', Sync) {
        inputs.property('replacements', legacyReplacements)
        from('src/main/java') {
            exclude overrides
            filter { String line ->
                legacyReplacements.each { oldValue, newValue -> line = line.replace(oldValue, newValue) }
                line
            }
        }
        from 'src/minecraft1211/java'
        into layout.buildDirectory.dir('generated/sources/minecraft1211/main')
    }
    sourceSets.main.java.setSrcDirs([generateLegacySources])
    def generateLegacyTests = tasks.register('generateLegacyTests', Sync) {
        inputs.property('replacements', legacyReplacements)
        from('src/selfTest/java') {
            filter { String line ->
                legacyReplacements.each { oldValue, newValue -> line = line.replace(oldValue, newValue) }
                if (line.contains('import net.minecraft.client.input.MouseButton')) return ''
                line = line.replaceAll('MouseButtonInfo (left|right|middle) = new MouseButtonInfo\\(([^,]+), 0\\)', 'int $1 = $2')
                line.replaceAll('new MouseButtonEvent\\(([^,]+), ([^,]+), (left|right|middle)\\), false', '$1, $2, $3')
            }
        }
        into layout.buildDirectory.dir('generated/sources/minecraft1211/selfTest')
    }
    sourceSets {
        selfTest { java.setSrcDirs([generateLegacyTests]) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_description: mod_description,
        mod_license: mod_license,
        mod_version: mod_version,
        thaumaturge_version_range: thaumaturge_version_range
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources') {
    inputs.property('mixinJavaVersion', targetJavaVersion)
    filesMatching('thaumaturge_node_navigator.mixins.json') {
        filter { String line -> line.replace('JAVA_25', "JAVA_${targetJavaVersion}") }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets {
    selfTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('trackerSelfTest', JavaExec) {
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'dev.thaumaturge.nodenavigator.client.TrackerSelfTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(targetJavaVersion) }
}
tasks.named('check') { dependsOn 'trackerSelfTest' }

tasks.withType(Jar).configureEach {
    destinationDirectory = layout.projectDirectory.dir('build/libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { archiveClassifier = "mc${minecraft_version}" }
tasks.named('sourcesJar') {
    archiveClassifier = "mc${minecraft_version}-sources"
    inputs.property('mixinJavaVersion', targetJavaVersion)
    filesMatching('thaumaturge_node_navigator.mixins.json') {
        filter { String line -> line.replace('JAVA_25', "JAVA_${targetJavaVersion}") }
    }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
