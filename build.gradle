plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Leclown'
        url = 'https://maven.leclowndu93150.dev/releases'
        content { includeGroup 'com.leclowndu93150' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation files(providers.gradleProperty('thaumaturge_jar').get())
    localRuntime files(providers.gradleProperty('curios_jar').get())
    localRuntime files(providers.gradleProperty('lithostitched_jar').get())
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_description: mod_description,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets {
    selfTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('trackerSelfTest', JavaExec) {
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'dev.thaumaturge.nodenavigator.client.TrackerSelfTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn 'trackerSelfTest' }

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
